name: Locked Use issue 157 native validation

on:
  push:
    branches: [ci/locked-use-157]

permissions:
  contents: read

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 3
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Verify original coordinator fails the new regression
        shell: bash
        run: |
          git worktree add --detach ../baseline 7657d49b641db367ec4b5d9c8d41e638501c82cd
          cp packages/OpenComputerUseKit/Tests/OpenComputerUseKitTests/LockedUseBrokerCoordinatorTests.swift ../baseline/packages/OpenComputerUseKit/Tests/OpenComputerUseKitTests/
          if swift test --package-path ../baseline -j 4 --filter LockedUseBrokerCoordinatorTests/testNextLeaseWaitsForGuardianReleaseAcknowledgment > baseline.log 2>&1; then
            cat baseline.log
            echo "Expected the original coordinator to reject Guardian cleanup"
            exit 1
          fi
          cat baseline.log
          grep -q clientUnauthorized baseline.log
      - name: Verify fixed Locked Use tests
        run: swift test -j 4 --filter LockedUse
      - name: Check repository documentation
        run: make check-docs
